name: blackjack_21
description: "Blackjack 21 — app multiplataforma (Android, Web, Windows, iOS)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# NOTA: dependencias añadidas por fase para evitar fijar versiones que queden
# obsoletas. Fase 1 (lógica pura + tests) solo necesita el SDK de Flutter.
# Las siguientes se agregarán al llegar a su fase:
#   - go_router                             (Fase 2+: navegación y deep links)
#   - firebase_core, firebase_auth,
#     cloud_firestore, cloud_functions     (Fase 3+: backend)
#   - livekit_client                        (Fase 6: voz/cámara)
#   - google_mobile_ads, firebase_messaging (Fase 7: monetización/push)
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Fase 2: gestión de estado (UI ↔ lógica de dominio). Se usa con un Notifier
  # escrito a mano (sin codegen) para no depender de build_runner.
  flutter_riverpod: ^2.5.1
  # Fase 3: Firebase (core + auth + firestore)
  # Fase 7: BoM subido a la generación 4.x/6.x para eliminar el warning KGP
  # (firebase_analytics ≥12.2.0 ya no aplica el Kotlin Gradle Plugin).
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.0.0
  go_router: ^17.4.0
  # Fase 4: llamadas a Cloud Functions (transferCredits)
  cloud_functions: ^6.0.0
  # Fase 6: observabilidad (Crashlytics en Android/iOS; Analytics en Android/iOS/Web)
  firebase_analytics: ^12.2.0
  firebase_crashlytics: ^5.0.0
  # Fase 7: App Check (Play Integrity / App Attest / reCAPTCHA v3). Windows no-op.
  firebase_app_check: ^0.4.0
  firebase_messaging: ^16.3.0
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

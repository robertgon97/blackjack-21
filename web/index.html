<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App multiplataforma de Blackjack 21 con multijugador en tiempo real.">
  <meta name="theme-color" content="#0B6E3B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blackjack 21">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Blackjack 21</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Pantalla de carga mientras se descarga el bundle de Flutter (evita el
       blanco inicial). Se elimina al primer frame de Flutter. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #11603a, #0a2c1c);
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading .logo { font-size: 72px; line-height: 1; }
    #loading .titulo { margin-top: 16px; font-size: 22px; font-weight: 700; }
    #loading .spinner {
      margin-top: 28px;
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">🃏</div>
    <div class="titulo">Blackjack 21</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Oculta la pantalla de carga cuando Flutter pinta su primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function () { loading.remove(); }, 300);
      }
    });
  </script>
</body>
</html>

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kotlin integrado de Flutter (AGP 9+). NO se puede activar (true) todavía:
# cloud_firestore 6.5.0 aún aplica el viejo Kotlin Gradle Plugin sin el guard
# condicional que sí tienen firebase_analytics/cloud_functions/firebase_app_check,
# así que con built-in Kotlin el build de :cloud_firestore falla. Queda en false
# hasta que FlutterFire publique un cloud_firestore migrado a built-in Kotlin;
# entretanto persiste el warning KGP (benigno con Flutter 3.44.x).
# Ver docs/errores-y-correcciones.md.
android.builtInKotlin=false
